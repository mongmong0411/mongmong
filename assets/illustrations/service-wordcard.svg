<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-label="반복 학습을 위한 영어단어카드 세트 일러스트">
  <rect width="800" height="350" fill="#eef7ee"/>
  <circle cx="100" cy="70" r="80" fill="#e8722e" opacity="0.10"/>
  <circle cx="720" cy="290" r="90" fill="#1e6f5c" opacity="0.10"/>

  <!-- 뒤쪽 카드 더미 -->
  <rect x="260" y="120" width="220" height="150" rx="18" fill="#1e6f5c" opacity="0.55" transform="rotate(-8 370 195)"/>
  <rect x="300" y="130" width="220" height="150" rx="18" fill="#1e6f5c" opacity="0.8" transform="rotate(4 410 205)"/>

  <!-- 앞쪽 카드: 단어 -->
  <rect x="240" y="90" width="230" height="160" rx="20" fill="#ffffff" stroke="#e2ddcd" stroke-width="3"/>
  <text x="355" y="180" font-family="'Noto Sans KR',sans-serif" font-size="42" font-weight="800" fill="#1e6f5c" text-anchor="middle">apple</text>
  <text x="355" y="212" font-family="'Noto Sans KR',sans-serif" font-size="20" font-weight="600" fill="#e8722e" text-anchor="middle">사과</text>

  <!-- 회전 화살표 (반복 학습) -->
  <g transform="translate(560,80)">
    <path d="M0 30 A30 30 0 1 1 8 55" fill="none" stroke="#e8722e" stroke-width="8" stroke-linecap="round"/>
    <path d="M-6 46 L8 55 L20 38" fill="none" stroke="#e8722e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 작은 단어 칩들 -->
  <rect x="90" y="230" width="110" height="46" rx="23" fill="#ffffff" stroke="#c8e0cb" stroke-width="2"/>
  <text x="145" y="260" font-family="'Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#12513f" text-anchor="middle">book</text>

  <rect x="560" y="240" width="130" height="46" rx="23" fill="#ffffff" stroke="#c8e0cb" stroke-width="2"/>
  <text x="625" y="270" font-family="'Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#12513f" text-anchor="middle">family</text>
</svg>
