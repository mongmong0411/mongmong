<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="선생님이 시니어 학습자의 집을 방문해 마주 앉아 학습지를 함께 보는 장면 일러스트">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3efe4"/>
      <stop offset="100%" stop-color="#e9f2ea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <circle cx="670" cy="90" r="120" fill="#e8722e" opacity="0.10"/>
  <circle cx="90" cy="500" r="140" fill="#1e6f5c" opacity="0.10"/>

  <!-- 바닥 -->
  <rect x="0" y="470" width="800" height="130" fill="#e2ddcd" opacity="0.35"/>

  <!-- 테이블 -->
  <rect x="180" y="430" width="440" height="26" rx="10" fill="#12513f"/>
  <rect x="210" y="456" width="20" height="90" fill="#12513f"/>
  <rect x="570" y="456" width="20" height="90" fill="#12513f"/>

  <!-- 테이블 위 학습지 -->
  <rect x="330" y="392" width="140" height="90" rx="8" fill="#ffffff"/>
  <rect x="345" y="410" width="110" height="10" rx="5" fill="#e2ddcd"/>
  <rect x="345" y="428" width="90" height="10" rx="5" fill="#e2ddcd"/>
  <rect x="345" y="446" width="70" height="10" rx="5" fill="#e8722e" opacity="0.7"/>

  <!-- 선생님 (왼쪽) -->
  <g transform="translate(220,150)">
    <ellipse cx="0" cy="330" rx="80" ry="18" fill="#12513f" opacity="0.12"/>
    <rect x="-60" y="150" width="120" height="190" rx="40" fill="#1e6f5c"/>
    <circle cx="0" cy="90" r="70" fill="#f4d7b8"/>
    <path d="M-70 60 Q0 -20 70 60 L70 100 Q0 40 -70 100 Z" fill="#3b3128"/>
    <circle cx="-24" cy="92" r="6" fill="#3b3128"/>
    <circle cx="24" cy="92" r="6" fill="#3b3128"/>
    <path d="M-18 118 Q0 132 18 118" stroke="#a9622e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-60 210 Q-120 240 -110 300" stroke="#1e6f5c" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M60 210 Q125 250 108 300" stroke="#1e6f5c" stroke-width="26" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 시니어 학습자 (오른쪽) -->
  <g transform="translate(560,150)">
    <ellipse cx="0" cy="330" rx="80" ry="18" fill="#12513f" opacity="0.12"/>
    <rect x="-60" y="150" width="120" height="190" rx="40" fill="#e8722e"/>
    <circle cx="0" cy="90" r="70" fill="#f4d7b8"/>
    <path d="M-68 50 Q0 -10 68 50 Q70 30 40 20 Q0 0 -40 20 Q-70 30 -68 50 Z" fill="#d9d4c9"/>
    <circle cx="-24" cy="92" r="6" fill="#3b3128"/>
    <circle cx="24" cy="92" r="6" fill="#3b3128"/>
    <path d="M-16 120 Q0 130 16 120" stroke="#a9622e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-60 210 Q-10 250 40 235" stroke="#e8722e" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M60 210 Q118 245 100 300" stroke="#e8722e" stroke-width="26" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 말풍선 -->
  <g transform="translate(345,90)">
    <rect x="0" y="0" width="150" height="60" rx="18" fill="#ffffff"/>
    <path d="M55 60 L75 60 L60 84 Z" fill="#ffffff"/>
    <text x="75" y="38" font-family="'Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#1e6f5c" text-anchor="middle">함께 문장을!</text>
  </g>
</svg>
